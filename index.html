<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    Pentru register:
    - nume
    - prenume
    - email
    - parola
    - numar de telefon
    - data nasterii
    - dropdown an studiu
    -->
    <form>
        <h1>Register</h1>
        <label>Nume</label>
        <input type="text" name="Nume" id="name" />
       
        
        <div>
            <label for="prenume">Prenume</label>
            <input type="text" name="Prenume" id="prenume" />
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" name="Email" id="email" placeholder="ceva@domain.com" />
        </div>

        <div>
            <label for="password">Parola</label>
            <input type="password" name="Password" id="password" />
        </div>

        <div>
            <label for="dataNastere">Data nasterii</label>
            <input type="date" name="dataNastere" id="dataNastere" />
        </div>

        <div>
            <label for="nrTelefon">Numar de telefon</label>
            <input type="tel" pattern="[0-9]{7}" name="nrTelefon" id="nrTelefon" />
        </div>

        <label for="conditii">Accept TOS</label>
        <input type="checkbox" name="conditii" id="conditii" required/>

        <div>
            <label for="anStudiu">An studiu</label>
            <select name="anStudiu" id="anStudiu">
                <option value="1">Anul 1</option>
                <option value="2" selected>Anul 2</option>
            </select>
        </div>

        <div>
            <div>
                <label for="sec">Intrebare securitate: 1 + 1 =</label>
                <input type="number" name="sec" min="0" max="10" id="sec" />
            </div>

            <div>
                <label for="refferal">Cod invitatie</label>
                <input type="text" name="refferal" value="reducere75" disabled id="refferal" />
            </div>
            
            <input type="reset" name="Reset" />
            <input type="submit" name="Register" />
        </div>
    </form>
</body>
</html>
